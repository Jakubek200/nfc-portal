<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFC GLITCH PORTAL</title>

<style>
body{
  margin:0;
  background:black;
  color:#00ff00;
  font-family:monospace;
  text-align:center;
}

.glitch{
  font-size:40px;
  margin-top:20%;
  animation:glitch 0.2s infinite;
}

@keyframes glitch{
  0%{text-shadow:3px 0 red;}
  50%{text-shadow:-3px 0 blue;}
  100%{text-shadow:3px 0 red;}
}

button{
  padding:20px;
  font-size:18px;
  margin-top:40px;
  background:#00ff00;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="glitch">NFC SYSTEM ACTIVE</div>
<button onclick="activate()">AKTYWUJ</button>

<script>

const BOT_TOKEN = "WSTAW_TOKEN";
const CHAT_ID = "WSTAW_CHAT_ID";

// 🔥 LICZNIK
let count = localStorage.getItem("count") || 0;
count++;
localStorage.setItem("count", count);

// 🔊 DŹWIĘKI (glitch / error / creepy)
const sounds = [
  "https://www.soundjay.com/button/sounds/button-10.mp3",
  "https://www.soundjay.com/button/sounds/button-4.mp3",
  "https://www.soundjay.com/misc/sounds/fail-buzzer-02.mp3",
  "https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"
];

function activate(){

  // 🔊 losowy dźwięk
  let sound = sounds[Math.floor(Math.random()*sounds.length)];
  let audio = new Audio(sound);
  audio.play();

  // 🔥 TELEGRAM (działa u Ciebie już)
  let text = encodeURIComponent(
    "🔥 NFC ENTRY\nWejścia: "+count+
    "\nGodzina: "+new Date().toLocaleString()
  );

  let img = new Image();
  img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`;

  // 🔥 glitch efekt ekranu
  document.body.style.filter = "contrast(200%) hue-rotate(90deg)";
  setTimeout(()=>{
    document.body.style.filter = "none";
  },300);

}

</script>

</body>
</html>
