<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hacker Control Panel</title>

<style>
body{
  margin:0;
  background:black;
  color:#00ff00;
  font-family:monospace;
  text-align:center;
}

h1{
  margin-top:50px;
  animation:glitch 0.2s infinite;
}

@keyframes glitch{
  0%{text-shadow:2px 0 red;}
  50%{text-shadow:-2px 0 blue;}
  100%{text-shadow:2px 0 red;}
}

button{
  display:block;
  margin:20px auto;
  padding:15px;
  font-size:18px;
  background:#00ff00;
  border:none;
  cursor:pointer;
}

</style>
</head>

<body>

<h1>NFC CONTROL PANEL</h1>

<button onclick="sound1()">🔊 SOUND 1</button>
<button onclick="sound2()">🔊 SOUND 2</button>
<button onclick="hack()">💀 HACK MODE</button>

<script>

const BOT_TOKEN = "WSTAW_TOKEN";
const CHAT_ID = "WSTAW_CHAT_ID";

// 🔊 DŹWIĘKI
function play(url){
  let audio = new Audio(url);
  audio.play();
}

function sound1(){
  play("https://www.soundjay.com/button/beep-07.wav");
  send("Sound 1 triggered");
}

function sound2(){
  play("https://www.soundjay.com/button/sounds/button-10.mp3");
  send("Sound 2 triggered");
}

function hack(){
  document.body.style.filter="invert(1)";
  setTimeout(()=>document.body.style.filter="none",300);

  play("https://www.soundjay.com/misc/sounds/fail-buzzer-02.mp3");
  send("HACK MODE ACTIVATED");
}

// 📡 TELEGRAM MESSAGE
function send(text){
  let img = new Image();
  img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
}

</script>

</body>
</html>
